# Copy to config.yml on the server, fill in the tunnel UUID and put <UUID>.json beside it
# (the same tunnel the PC uses today; stop the PC first so only one connector runs). Neither file is committed.
tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: /etc/cloudflared/REPLACE_WITH_TUNNEL_UUID.json
ingress:
  # Router CWMP check-ins: device-authenticated, never behind Cloudflare Access.
  - hostname: netops.kadenetworks.com
    path: ^/cwmp/
    service: http://acs:7548
    originRequest:
      httpHostHeader: netops.kadenetworks.com
  - hostname: netops.kadenetworks.com
    service: http://hub:4317
    originRequest:
      httpHostHeader: netops.kadenetworks.com
  - service: http_status:404
