# Always-on Network Hub for a Linux server. Memory caps fit a 1 GB server with swap; raise them in .env on larger servers. No ports are published: the only way in is the Cloudflare Tunnel.
# Setup: docs/ALWAYS-ON.md
services:
  hub:
    mem_limit: ${HUB_MEMORY:-300m}
    build: .
    restart: unless-stopped
    environment:
      NETWORK_PUBLIC_ORIGIN: https://netops.kadenetworks.com
      NETWORK_POLL_MS: ${NETWORK_POLL_MS:-30000}
    volumes:
      - hub-data:/data
    networks: [internal]

  mongo:
    mem_limit: ${MONGO_MEMORY:-450m}
    image: ${MONGO_IMAGE:-mongo:8.2}
    restart: unless-stopped
    command: ["mongod", "--auth", "--bind_ip_all", "--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-0.25}"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env}
    volumes:
      - mongo-data:/data/db
    networks: [internal]

  acs:
    mem_limit: ${ACS_MEMORY:-400m}
    build:
      context: .
      dockerfile: deployment/docker/acs/Dockerfile
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:?set in .env}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env}
      MONGO_APP_USER: ${MONGO_APP_USER:-networkhub-acs}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set in .env}
    volumes:
      - acs-private:/private
    networks: [internal]

  tunnel:
    mem_limit: ${TUNNEL_MEMORY:-100m}
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on: [hub, acs]
    # Dashboard-managed tunnel: hostnames are set in Cloudflare Zero Trust, the server only holds the token.
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    networks: [internal]

volumes:
  hub-data:
  mongo-data:
  acs-private:

networks:
  internal:
