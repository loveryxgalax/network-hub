<!doctype html><html lang="en"><head><script src="/portal/eat.js?v=1"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M-Pesa Checkout</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<style>@font-face{font-family:"Google Sans";font-style:normal;font-weight:400;font-display:swap;src:url("/fonts/extra/GoogleSans-400.woff2") format("woff2")}@font-face{font-family:"Google Sans";font-style:normal;font-weight:500;font-display:swap;src:url("/fonts/extra/GoogleSans-500.woff2") format("woff2")}@font-face{font-family:"Google Sans";font-style:normal;font-weight:600;font-display:swap;src:url("/fonts/extra/GoogleSans-600.woff2") format("woff2")}@font-face{font-family:"Google Sans";font-style:normal;font-weight:700;font-display:swap;src:url("/fonts/extra/GoogleSans-700.woff2") format("woff2")}
html{-webkit-font-smoothing:antialiased;font-synthesis:none}button,input{font:inherit}
body{margin:0;font:16px "Google Sans";background:#f1f5f9;color:#0f172a;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
.c{background:#fff;border-radius:18px;max-width:400px;width:100%;box-shadow:0 18px 40px -20px rgba(15,23,42,.35);overflow:hidden}
.hd{background:#0032fd;color:#fff;padding:20px 22px}.hd small{opacity:.8;font-size:13px}.hd h1{margin:4px 0 0;font-size:21px}
.bd{padding:20px 22px 22px}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #e2e8f0;font-size:14.5px}.row span{color:#64748b}.row b{text-align:right}
.amt{font-size:28px;font-weight:800;color:#0032fd;margin:16px 0 4px}label{display:block;font-size:13.5px;font-weight:600;margin:14px 0 6px}
input{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:11px;padding:12px 13px;font-size:16px}input:focus{outline:2px solid #0032fd;border-color:#0032fd}
button{width:100%;margin-top:16px;border:0;border-radius:12px;background:#0032fd;color:#fff;font-weight:700;font-size:16px;padding:14px;cursor:pointer}button[disabled]{opacity:.6}
.msg{margin-top:14px;font-size:14.5px;text-align:center}.ok{color:#16a34a;font-weight:700}.bad{color:#dc2626}.wait{color:#64748b}
*,*::before,*::after,*::placeholder{text-transform:none!important}</style></head>
<body><div class="c"><div class="hd"><small>M-Pesa Checkout</small><h1 id="biz">Loading…</h1></div>
<div class="bd" id="bd"><p class="wait">Loading…</p></div></div><script src="/portal/pay.js?v=20261118k" defer></script></body></html>
