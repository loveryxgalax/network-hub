<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rate our support</title>
<style>body{margin:0;font:16px system-ui,sans-serif;background:#f3f5fb;color:#1f2633;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
.c{background:#fff;border-radius:16px;padding:24px 20px;max-width:380px;width:100%;box-shadow:0 10px 30px -15px rgba(15,23,42,.3);text-align:center}
h1{font-size:20px;margin:0 0 6px}p{color:#6b7280;margin:0 0 18px}.r{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
button{border:0;border-radius:12px;background:#e8edff;color:#0032fd;font-size:22px;font-weight:700;padding:14px 0;cursor:pointer}button:hover,button:focus-visible{background:#0032fd;color:#fff;outline:0}
.l{display:flex;justify-content:space-between;font-size:12px;color:#6b7280;margin-top:6px}.done{color:#13895f;font-weight:600}
/* Preserve original text casing across the interface. */
*,*::before,*::after,*::placeholder{text-transform:none!important}
</style></head>
<body><div class="c" id="c"><h1>How did we do?</h1><p>Rate the help you got from our team.</p><div class="r">
<button data-s="1">1</button><button data-s="2">2</button><button data-s="3">3</button><button data-s="4">4</button><button data-s="5">5</button></div>
<div class="l"><span>Poor</span><span>Excellent</span></div></div><script src="/portal/rate.js" defer></script></body></html>
